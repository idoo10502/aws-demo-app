# Copy this file into your own GitHub repo at: .github/workflows/deploy.yml
#
# On every push to main:
#   1. Authenticate to AWS via OIDC — no access keys stored in GitHub, ever
#   2. Build one Docker image and push it to ECR
#   3. Deploy that same image to ECS/Fargate (a single API call, ECS handles
#      the rolling replacement itself)
#   4. Deploy that same image to the EC2 instance via SSM Run Command
#      (you're writing the stop/pull/run logic yourself here — there's no
#      managed "update service" for a plain EC2 instance)
#
# Required repo configuration (Settings -> Secrets and variables -> Actions):
#   Variables tab -> AWS_ROLE_ARN = <output of setup_github_oidc.sh>

name: Deploy demo-app

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: cicd-demo-app
  ECS_CLUSTER: cicd-demo-cluster
  ECS_SERVICE: cicd-demo-service
  EC2_INSTANCE_NAME: cicd-demo-ec2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build -t "$IMAGE" -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy-fargate:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force a new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM (no SSH)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.EC2_INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          IMAGE="${{ needs.build-and-push.outputs.image }}"
          REGISTRY="${IMAGE%%/*}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $IMAGE\",
              \"docker stop demo-app || true\",
              \"docker rm demo-app || true\",
              \"docker run -d --name demo-app --restart unless-stopped -p 8080:8080 $IMAGE\"
            ]" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          echo "Deployed $IMAGE to EC2 instance $INSTANCE_ID"
